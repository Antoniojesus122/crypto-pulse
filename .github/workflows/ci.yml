name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto
          POSTGRES_DB: crypto_pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto
      POSTGRES_DB: crypto_pulse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Inicializar esquemas en Postgres
        env:
          PGPASSWORD: crypto
        run: |
          psql -h localhost -U crypto -d crypto_pulse -f sql/01_schemas.sql
          psql -h localhost -U crypto -d crypto_pulse -f sql/02_raw_tables.sql
          psql -h localhost -U crypto -d crypto_pulse -f sql/03_marts_views.sql

      - name: Lint con ruff
        run: ruff check src tests

      - name: Tests con pytest
        run: pytest