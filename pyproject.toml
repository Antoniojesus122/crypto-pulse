[project]
name = "crypto-pulse"
version = "0.1.0"
description = "Pipeline ETL horario para las top 50 criptomonedas"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Antonio" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prefect>=2.20,<3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "loguru>=0.7",
    "streamlit>=1.36",
    "pandas>=2.2",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_pulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/crypto_pulse --cov-report=term-missing"
